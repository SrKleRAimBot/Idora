name: Release Idora.JS

# Publishing is driven entirely by tags: `git tag Idora.JS/v1.0.0 && git push origin Idora.JS/v1.0.0`.
# The version comes from the tag rather than package.json, so the published package and the tag
# can never disagree.
#
# One tag releases idora.js and every extension package in extensions/ (idora.js-zod,
# idora.js-drizzle, idora.js-prisma) at the same version, each requiring that idora.js as a peer.
on:
  push:
    tags: ['Idora.JS/v*']

  # Dry run only: builds, tests, packs and verifies, but never publishes. Publishing is
  # irreversible, so it is reachable only from a tag push.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pack for the dry run. Nothing is published.'
        required: false
        default: '0.0.0-dryrun'
        type: string

# One release at a time: what a publish does (which dist-tag, what to skip) depends on what is
# already on npm, so two runs must not decide it at once.
concurrency:
  group: release-js
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      # Required for npm trusted publishing and provenance: the job requests a GitHub OIDC token
      # that npm exchanges for a short-lived publish credential. No npm token is stored anywhere.
      id-token: write
      # Write, not read: the final step creates the GitHub release.
      contents: write

    env:
      TZ: Australia/Sydney

    defaults:
      run:
        working-directory: Idora.JS

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1 or later, which ships with Node.js 24.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: Idora.JS/package-lock.json

      - name: Determine version
        id: version
        env:
          # Passed as data, never interpolated into the script: a hand-typed dry-run version is
          # validated below, and must not be able to run as shell before it is.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#Idora.JS/v}"
          fi

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid semantic version (expected e.g. 1.0.0 or 1.0.0-rc.1)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci

      - name: Stamp the version from the tag
        # On idora.js and every extension, whose idora.js peer range becomes ^<version>: an
        # extension is tested only against the idora.js released alongside it, so that is the
        # oldest it claims to work with. (For a prerelease, ^1.2.0-rc.1 also lets npm match it.)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version --workspaces --include-workspace-root
          VERSION="$VERSION" node -e '
            const fs = require("node:fs");
            for (const dir of fs.readdirSync("extensions")) {
              const path = `extensions/${dir}/package.json`;
              const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
              pkg.peerDependencies["idora.js"] = `^${process.env.VERSION}`;
              fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
            }
          '

      - name: Test
        # No package is published unless every suite passes on the exact source that is about to
        # be packed. The extensions are built and tested against this idora.js, not a published one,
        # so it is built first.
        run: |
          npm test
          npm run build
          npm run build --workspaces
          npm test --workspaces

      - name: Pack
        run: |
          npm pack
          npm pack --workspaces

      - name: Verify package contents
        # Cheap insurance against shipping a package missing its README, licence, entry points or
        # type declarations — and against a runtime dependency creeping in.
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          verify() {
            PKG="$1-$VERSION.tgz"
            shift
            test -f "$PKG" || { echo "::error::$PKG was not produced"; exit 1; }

            CONTENTS=$(tar -tzf "$PKG")
            echo "$CONTENTS"
            for required in package/package.json package/README.md package/LICENSE "$@"; do
              echo "$CONTENTS" | grep -qx "$required" || { echo "::error::$PKG is missing $required"; exit 1; }
            done
          }

          verify idora.js package/dist/index.js package/dist/index.d.ts
          verify idora.js-zod package/dist/index.js package/dist/index.d.ts
          verify idora.js-prisma package/dist/index.js package/dist/index.d.ts
          verify idora.js-drizzle package/dist/index.js package/dist/index.d.ts \
            package/dist/pg.js package/dist/pg.d.ts \
            package/dist/mysql.js package/dist/mysql.d.ts \
            package/dist/sqlite.js package/dist/sqlite.d.ts

          node -e '
            const fs = require("node:fs");
            const pkg = require("./package.json");
            for (const field of ["dependencies", "peerDependencies", "optionalDependencies"]) {
              if (pkg[field] && Object.keys(pkg[field]).length > 0) {
                console.error(`::error::package.json declares ${field}`);
                process.exit(1);
              }
            }

            for (const dir of fs.readdirSync("extensions")) {
              const extension = require(`./extensions/${dir}/package.json`);
              for (const field of ["dependencies", "optionalDependencies"]) {
                if (extension[field] && Object.keys(extension[field]).length > 0) {
                  console.error(`::error::${extension.name} declares ${field}`);
                  process.exit(1);
                }
              }

              if (extension.version !== pkg.version || extension.peerDependencies["idora.js"] !== `^${pkg.version}`) {
                console.error(`::error::${extension.name} is not stamped with version ${pkg.version}`);
                process.exit(1);
              }
            }
          '

      - name: Upload packages as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages-${{ steps.version.outputs.version }}
          path: Idora.JS/*.tgz

      - name: Check every package already exists on npm
        # Trusted publishing is configured per package, on the package's own settings page, so a
        # package that has never been published cannot be published from here. Checked before
        # anything is published, so a release never puts idora.js on npm and then stops at an
        # extension; see "Releasing a new package" in Idora.JS/README.md for the one-off setup.
        if: github.event_name == 'push'
        run: |
          MISSING=""
          for NAME in idora.js idora.js-zod idora.js-drizzle idora.js-prisma; do
            if OUTPUT=$(npm view "$NAME" name 2>&1); then
              continue
            fi
            if echo "$OUTPUT" | grep -q E404; then
              MISSING="$MISSING $NAME"
            else
              echo "::error::could not ask npm about $NAME:"; echo "$OUTPUT"; exit 1
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "::error::never published to npm:$MISSING. Publish each once by hand and add this workflow as its trusted publisher (Idora.JS/README.md, \"Releasing a new package\"), then re-run. Nothing was published."
            exit 1
          fi

      - name: Publish to npm
        # The irreversible step. Reachable only from an Idora.JS/v* tag push.
        #
        # Dist-tags: a prerelease goes to "next", so it never becomes "latest". A stable version
        # goes to "latest" unless that package's "latest" is already newer — a fix released on an
        # older line — in which case it goes to "maintenance-<major>.<minor>", so a fresh
        # `npm install` never moves backwards.
        #
        # idora.js goes first, so an extension is never on npm before the idora.js it requires. A
        # version that is already published is skipped rather than failing the run, so a release
        # that stopped part-way can be finished by re-running the workflow.
        if: github.event_name == 'push'
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          for NAME in idora.js idora.js-zod idora.js-drizzle idora.js-prisma; do
            if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null)" ]; then
              echo "$NAME@$VERSION is already published; skipping."
              continue
            fi

            LATEST=$(npm view "$NAME" dist-tags.latest 2>/dev/null || true)
            DIST_TAG=$(node -e '
              const [version, latest] = process.argv.slice(1);
              const core = (v) => v.split("-")[0].split(".").map(Number);
              const newer = (a, b) => { for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] > b[i]; return false; };
              if (version.includes("-")) console.log("next");
              else if (latest && newer(core(latest), core(version))) console.log(`maintenance-${core(version).slice(0, 2).join(".")}`);
              else console.log("latest");
            ' "$VERSION" "$LATEST")

            echo "Publishing $NAME@$VERSION under the \"$DIST_TAG\" dist-tag (latest is ${LATEST:-unset})."
            npm publish "$NAME-$VERSION.tgz" --provenance --access public --tag "$DIST_TAG"
          done

      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: Idora.JS v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: Idora.JS/*.tgz
