name: CI Idora.Go

on:
  push:
    branches: [main]
    paths: ['Idora.Go/**', 'spec/**', '.github/workflows/ci-go.yml']
  pull_request:
    branches: [main]
    paths: ['Idora.Go/**', 'spec/**', '.github/workflows/ci-go.yml']
  workflow_dispatch:

jobs:
  # The core module, github.com/SrKleRAimBot/Idora/Idora.Go, including its stdlib-only
  # subpackages such as idorahttp. `./...` stops at the nested modules below, which have their
  # own go.mod and their own job.
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The minimum in go.mod, and the newest stable release.
        go: ['1.23', 'stable']

    env:
      # Deliberately not UTC, so the time-zone assertions in timestamp_test.go are live.
      TZ: Australia/Sydney

    defaults:
      run:
        working-directory: Idora.Go

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: Idora.Go/go.mod

      - name: Check formatting
        # gofmt walks into the nested extension modules too, which is intended.
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::files above are not gofmt-formatted"; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Check the module has no dependencies
        # The zero-dependency promise is part of the module's contract, so it is enforced.
        run: |
          if grep -Eq '^\s*require' go.mod; then
            echo "::error::go.mod declares a dependency"; cat go.mod; exit 1
          fi

      - name: Test
        run: go test -race -count=1 ./...

      - name: Benchmark (smoke)
        # A single short pass so the benchmarks keep compiling and running; numbers from shared CI
        # runners are not meaningful.
        run: go test -run '^$' -bench . -benchtime 100x ./...

  # The extension modules with third-party dependencies. Each requires the core at its released
  # version, and replaces it with ../ so that it is built and tested against the core at this
  # commit; consumers ignore the replace directive (see Idora.Go/README.md, "Releasing").
  extensions:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module: [idoragorm, idorapgx]
        go: ['1.23', 'stable']

    env:
      TZ: Australia/Sydney

    defaults:
      run:
        working-directory: Idora.Go/${{ matrix.module }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: Idora.Go/${{ matrix.module }}/go.sum

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Check the core is replaced by this checkout
        run: |
          if ! grep -Eq '^replace github.com/SrKleRAimBot/Idora/Idora.Go => \.\./?$' go.mod; then
            echo "::error::go.mod must replace the core module with ../ so CI tests this commit"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...
