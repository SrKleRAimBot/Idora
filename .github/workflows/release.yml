name: Release

# Publishing is driven entirely by tags: `git tag v1.0.0 && git push origin v1.0.0`.
# The version comes from the tag rather than the csproj, so the published package and the
# tag can never disagree.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 1.0.0)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      # Required for Trusted Publishing: lets the job request an OIDC token from GitHub that
      # nuget.org exchanges for a short-lived API key. No secrets are stored anywhere.
      id-token: write
      # Write, not read: the final step creates the GitHub release and uploads the packages to it.
      contents: write

    env:
      # Deliberately not UTC, matching CI, so a local-time regression cannot slip through here
      # either. See tests/UserFriendlyIds.Tests/TimestampSourceTests.cs.
      TZ: Australia/Sydney

    steps:
      - uses: actions/checkout@v4
        with:
          # Source Link stamps the commit into the symbols package, which needs full history.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          # Guard against a mistyped tag producing a nonsense package version. NuGet versions
          # are irreversible once published, so this is worth being strict about.
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid semantic version (expected e.g. 1.0.0 or 1.0.0-rc.1)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Build
        run: dotnet build -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        # The package is never published unless the whole suite passes on the exact build
        # that is about to be packed.
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Pack
        run: |
          dotnet pack src/UserFriendlyIds/UserFriendlyIds.csproj \
            -c Release --no-build \
            -p:Version=${{ steps.version.outputs.version }} \
            -o artifacts

      - name: Verify package contents
        # Cheap insurance against shipping a package missing its README, icon or a target
        # framework. Far easier to catch here than after an irreversible push.
        run: |
          PKG="artifacts/UserFriendlyIds.${{ steps.version.outputs.version }}.nupkg"
          test -f "$PKG" || { echo "::error::$PKG was not produced"; exit 1; }
          test -f "artifacts/UserFriendlyIds.${{ steps.version.outputs.version }}.snupkg" \
            || { echo "::error::symbols package was not produced"; exit 1; }

          CONTENTS=$(unzip -Z1 "$PKG")
          echo "$CONTENTS"
          for required in \
            "README.md" \
            "icon.png" \
            "lib/net8.0/UserFriendlyIds.dll" \
            "lib/net9.0/UserFriendlyIds.dll" \
            "lib/net10.0/UserFriendlyIds.dll" \
            "lib/net8.0/UserFriendlyIds.xml"
          do
            echo "$CONTENTS" | grep -qx "$required" \
              || { echo "::error::package is missing $required"; exit 1; }
          done

      - name: Upload package as a build artifact
        # Kept regardless of whether the push succeeds, so a failed publish can be diagnosed.
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ steps.version.outputs.version }}
          path: artifacts/*

      - name: Log in to NuGet (OIDC, short-lived key)
        # Requested immediately before the push: these keys are valid for one hour, and each
        # OIDC token can be exchanged exactly once.
        uses: NuGet/login@v1
        id: login
        with:
          user: SrKleRAimBot

      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
