name: CI Idora.JS

on:
  push:
    branches: [main]
    paths: ['Idora.JS/**', 'spec/**', '.github/workflows/ci-js.yml']
  pull_request:
    branches: [main]
    paths: ['Idora.JS/**', 'spec/**', '.github/workflows/ci-js.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release line, the current LTS, and the newest.
        node: [20, 22, 24]

    env:
      # Deliberately not UTC, so the assertions in test/timestamp.test.ts are live. A local-time bug
      # is invisible on a runner that is already in UTC.
      TZ: Australia/Sydney

    defaults:
      run:
        working-directory: Idora.JS

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: Idora.JS/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check the package has no runtime dependencies
        # The zero-dependency promise is part of the package's contract, so it is enforced rather
        # than merely intended.
        run: |
          node -e '
            const pkg = require("./package.json");
            for (const field of ["dependencies", "peerDependencies", "optionalDependencies"]) {
              if (pkg[field] && Object.keys(pkg[field]).length > 0) {
                console.error(`::error::package.json declares ${field}: ${Object.keys(pkg[field]).join(", ")}`);
                process.exit(1);
              }
            }
          '

      - name: Pack
        run: npm pack

      - name: Upload package
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: Idora.JS/*.tgz
