name: CI Idora.Rust

on:
  push:
    branches: [main]
    paths: ['Idora.Rust/**', 'spec/**', '.github/workflows/ci-rust.yml']
  pull_request:
    branches: [main]
    paths: ['Idora.Rust/**', 'spec/**', '.github/workflows/ci-rust.yml']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Deliberately not UTC, so the time-zone assertions in tests/timestamp.rs are live.
  TZ: Australia/Sydney

jobs:
  test:
    # Every operating system, because each has its own entropy source in src/sys.rs:
    # getentropy on Linux, CCRandomGenerateBytes on macOS, ProcessPrng on Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: Idora.Rust

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Benchmark (smoke)
        # Compiles and runs the hand-rolled harness; numbers from shared runners are not meaningful.
        run: cargo bench

  msrv:
    # The rust-version in Cargo.toml is a promise; build and test on exactly that toolchain.
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Idora.Rust

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust 1.85
        run: rustup toolchain install 1.85 --profile minimal && rustup default 1.85

      - name: Test
        run: cargo test

  package:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Idora.Rust

    steps:
      - uses: actions/checkout@v4

      - name: Check the crate has no dependencies
        # The zero-dependency promise covers dev-dependencies too, so it is enforced.
        run: |
          if cargo metadata --format-version 1 --no-deps | grep -q '"dependencies":\[{'; then
            echo "::error::Cargo.toml declares a dependency"; exit 1
          fi

      - name: Package
        run: cargo package
