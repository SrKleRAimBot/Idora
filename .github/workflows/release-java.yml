name: Release Idora.Java

# Publishing is driven entirely by tags: `git tag Idora.Java/v1.0.0 && git push origin Idora.Java/v1.0.0`.
# The version comes from the tag rather than the POM, so the published artifact and the tag can
# never disagree.
on:
  push:
    tags: ['Idora.Java/v*']

  # Dry run only: builds, tests, signs nothing and uploads nothing.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build for the dry run. Nothing is published.'
        required: false
        default: '0.0.0-dryrun'
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: Idora.Java

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          # Writes a settings.xml <server id="central"> that reads its credentials from the
          # environment variables named here, which the deploy step supplies from secrets.
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#Idora.Java/v}"
          fi

          # Maven Central versions are irreversible once published, so be strict.
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid semantic version (expected e.g. 1.0.0 or 1.0.0-rc.1)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp the version from the tag
        run: mvn -B versions:set -DnewVersion="${{ steps.version.outputs.version }}" -DgenerateBackupPoms=false

      - name: Build and test
        # The artifact is never published unless the whole suite passes on the exact build that is
        # about to be deployed.
        run: mvn -B verify

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: idora-java-${{ steps.version.outputs.version }}
          path: Idora.Java/idora/target/*.jar

      - name: Sign and publish to Maven Central
        # The irreversible step. Reachable only from an Idora.Java/v* tag push. The release profile
        # signs with the in-process BouncyCastle signer, so no gpg binary or keyring is involved,
        # and publishes through the Central Portal with automatic release.
        if: github.event_name == 'push'
        run: mvn -B -P release -DskipTests deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: Idora.Java v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: Idora.Java/idora/target/*.jar
