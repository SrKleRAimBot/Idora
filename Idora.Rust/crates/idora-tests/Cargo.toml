[package]
name = "idora-tests"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
description = "Not published. Tests for idora's optional serde and sqlx features, kept out of the idora crate so that its default test build stays free of dependencies."
license = "MIT"
publish = false

[dependencies]

[dev-dependencies]
idora = { path = "../..", features = ["serde", "sqlx"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "postgres", "runtime-tokio", "derive"] }
tokio = { version = "1.44", features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
